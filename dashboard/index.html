<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>BobWatch Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      padding: 16px;
      line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--vscode-sideBar-background);
      border: 1px solid var(--vscode-panel-border);
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-info {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 12px;
      color: var(--vscode-descriptionForeground);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-live {
      background: var(--vscode-testing-iconPassed);
      color: var(--vscode-editor-background);
    }

    .badge-paused {
      background: var(--vscode-testing-iconQueued);
      color: var(--vscode-editor-background);
    }

    /* Metric Cards */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: var(--vscode-sideBar-background);
      border: 1px solid var(--vscode-panel-border);
      border-radius: 4px;
      padding: 16px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--vscode-foreground);
    }

    .metric-change {
      font-size: 11px;
      margin-top: 4px;
      color: var(--vscode-descriptionForeground);
    }

    /* Panels */
    .panel {
      background: var(--vscode-sideBar-background);
      border: 1px solid var(--vscode-panel-border);
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--vscode-foreground);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Mode Breakdown */
    .mode-bar {
      display: flex;
      height: 32px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .mode-segment {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: white;
      transition: opacity 0.2s;
    }

    .mode-segment:hover {
      opacity: 0.8;
    }

    .mode-code { background: #007acc; }
    .mode-plan { background: #68217a; }
    .mode-advanced { background: #ff6b6b; }
    .mode-orchestrator { background: #ffa500; }
    .mode-ask { background: #4caf50; }

    .mode-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
    }

    .mode-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    /* Audit Log */
    .audit-log {
      max-height: 400px;
      overflow-y: auto;
    }

    .audit-entry {
      padding: 12px;
      border-left: 3px solid var(--vscode-focusBorder);
      background: var(--vscode-editor-background);
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
    }

    .audit-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .mode-badge {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      color: white;
    }

    .audit-summary {
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--vscode-foreground);
    }

    .audit-meta {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
    }

    .audit-reason {
      font-size: 12px;
      color: var(--vscode-descriptionForeground);
      margin-top: 8px;
      font-style: italic;
    }

    .flag-badge {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      background: var(--vscode-inputValidation-warningBackground);
      color: var(--vscode-inputValidation-warningForeground);
      border: 1px solid var(--vscode-inputValidation-warningBorder);
    }

    /* Cost Chart */
    .cost-chart {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cost-bar-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cost-label {
      min-width: 100px;
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .cost-bar-wrapper {
      flex: 1;
      height: 24px;
      background: var(--vscode-editor-background);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .cost-bar {
      height: 100%;
      background: linear-gradient(90deg, #007acc, #005a9e);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 10px;
      color: white;
      font-weight: 600;
    }

    .cost-value {
      min-width: 60px;
      text-align: right;
      font-size: 11px;
      color: var(--vscode-foreground);
    }

    /* Prompt Diff */
    .prompt-diff {
      background: var(--vscode-editor-background);
      padding: 16px;
      border-radius: 4px;
      border-left: 4px solid var(--vscode-focusBorder);
    }

    .prompt-diff-label {
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .prompt-diff-content {
      font-size: 13px;
      line-height: 1.6;
      color: var(--vscode-foreground);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--vscode-scrollbarSlider-background);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--vscode-scrollbarSlider-hoverBackground);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--vscode-scrollbarSlider-activeBackground);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--vscode-descriptionForeground);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>🔍 BobWatch</h1>
    <div class="header-info">
      <span id="session-duration">Session: --</span>
      <span class="badge badge-live" id="status-badge">Live</span>
    </div>
  </div>

  <!-- Metric Cards -->
  <div class="metrics">
    <div class="metric-card">
      <div class="metric-label">Total Tokens</div>
      <div class="metric-value" id="total-tokens">0</div>
      <div class="metric-change" id="tokens-change">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">API Cost</div>
      <div class="metric-value" id="api-cost">$0.00</div>
      <div class="metric-change" id="cost-change">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Files Touched</div>
      <div class="metric-value" id="files-touched">0</div>
      <div class="metric-change" id="files-change">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Flags Raised</div>
      <div class="metric-value" id="flags-raised">0</div>
      <div class="metric-change" id="flags-change">--</div>
    </div>
  </div>

  <!-- Mode Breakdown -->
  <div class="panel">
    <div class="panel-title">📊 Mode Breakdown</div>
    <div class="mode-bar" id="mode-bar"></div>
    <div class="mode-legend" id="mode-legend"></div>
  </div>

  <!-- Audit Log -->
  <div class="panel">
    <div class="panel-title">📋 Audit Log</div>
    <div class="audit-log" id="audit-log"></div>
  </div>

  <!-- Cost per Task -->
  <div class="panel">
    <div class="panel-title">💰 Cost per Task</div>
    <div class="cost-chart" id="cost-chart"></div>
  </div>

  <!-- Prompt Diff -->
  <div class="panel">
    <div class="panel-title">💬 Latest Audit Summary</div>
    <div class="prompt-diff">
      <div class="prompt-diff-label">Plain English Summary</div>
      <div class="prompt-diff-content" id="prompt-diff-content">
        No audit entries yet...
      </div>
    </div>
  </div>

  <script>
    // Data will be injected by extension as window.__BOBWATCH_DATA__
    let data = window.__BOBWATCH_DATA__ || { sessions: [], summary: {} };

    // Mode colors mapping
    const MODE_COLORS = {
      code: '#007acc',
      plan: '#68217a',
      advanced: '#ff6b6b',
      orchestrator: '#ffa500',
      ask: '#4caf50'
    };

    // Initialize dashboard
    function init() {
      if (!data.sessions || data.sessions.length === 0) {
        showEmptyState();
        return;
      }

      renderMetrics();
      renderModeBreakdown();
      renderAuditLog();
      renderCostChart();
      renderPromptDiff();
      updateSessionDuration();
    }

    // Show empty state
    function showEmptyState() {
      const auditLog = document.getElementById('audit-log');
      auditLog.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">No sessions found. Add markdown files to bob_sessions/ directory.</div>
        </div>
      `;
    }

    // Render metric cards
    function renderMetrics() {
      const summary = data.summary || {};
      
      // Total tokens
      document.getElementById('total-tokens').textContent = 
        (summary.total_tokens || 0).toLocaleString();
      
      // API cost
      document.getElementById('api-cost').textContent = 
        '$' + (summary.total_cost || 0).toFixed(2);
      
      // Files touched
      const filesSet = new Set();
      data.sessions.forEach(session => {
        session.events?.forEach(event => {
          event.files_modified?.forEach(file => filesSet.add(file));
        });
      });
      document.getElementById('files-touched').textContent = filesSet.size;
      
      // Flags raised
      let flagCount = 0;
      data.sessions.forEach(session => {
        session.events?.forEach(event => {
          if (event.flag && event.flag !== 'none') flagCount++;
        });
      });
      document.getElementById('flags-raised').textContent = flagCount;
      
      // Update change indicators
      document.getElementById('tokens-change').textContent = 
        `${data.sessions.length} sessions`;
      document.getElementById('cost-change').textContent = 
        `${summary.total_events || 0} events`;
      document.getElementById('files-change').textContent = 
        `${data.sessions.length} tasks`;
      document.getElementById('flags-change').textContent = 
        flagCount > 0 ? '⚠️ Review needed' : '✓ All clear';
    }

    // Render mode breakdown
    function renderModeBreakdown() {
      const modeBar = document.getElementById('mode-bar');
      const modeLegend = document.getElementById('mode-legend');
      
      // Count events by mode
      const modeCounts = {};
      let totalEvents = 0;
      
      data.sessions.forEach(session => {
        session.events?.forEach(event => {
          const mode = event.mode || 'unknown';
          modeCounts[mode] = (modeCounts[mode] || 0) + 1;
          totalEvents++;
        });
      });
      
      if (totalEvents === 0) {
        modeBar.innerHTML = '<div style="padding: 8px; text-align: center; color: var(--vscode-descriptionForeground);">No mode data available</div>';
        return;
      }
      
      // Render bar segments
      modeBar.innerHTML = '';
      Object.entries(modeCounts).forEach(([mode, count]) => {
        const percentage = (count / totalEvents) * 100;
        const segment = document.createElement('div');
        segment.className = `mode-segment mode-${mode}`;
        segment.style.width = percentage + '%';
        segment.textContent = percentage > 10 ? `${Math.round(percentage)}%` : '';
        segment.title = `${mode}: ${count} events (${percentage.toFixed(1)}%)`;
        modeBar.appendChild(segment);
      });
      
      // Render legend
      modeLegend.innerHTML = '';
      Object.entries(modeCounts).forEach(([mode, count]) => {
        const percentage = ((count / totalEvents) * 100).toFixed(1);
        const item = document.createElement('div');
        item.className = 'mode-legend-item';
        item.innerHTML = `
          <div class="mode-color mode-${mode}"></div>
          <span>${mode}: ${count} (${percentage}%)</span>
        `;
        modeLegend.appendChild(item);
      });
    }

    // Render audit log
    function renderAuditLog() {
      const auditLog = document.getElementById('audit-log');
      auditLog.innerHTML = '';
      
      // Collect all events
      const allEvents = [];
      data.sessions.forEach(session => {
        session.events?.forEach(event => {
          allEvents.push({
            ...event,
            session_file: session.file,
            timestamp: session.timestamp
          });
        });
      });
      
      // Sort by timestamp (newest first)
      allEvents.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      // Render entries
      allEvents.forEach(event => {
        const entry = document.createElement('div');
        entry.className = 'audit-entry';
        
        const hasFlag = event.flag && event.flag !== 'none';
        const flagBadge = hasFlag ? 
          `<span class="flag-badge">⚠️ ${event.flag}</span>` : '';
        
        entry.innerHTML = `
          <div class="audit-header">
            <span class="mode-badge mode-${event.mode || 'unknown'}">${event.mode || 'unknown'}</span>
            ${flagBadge}
          </div>
          <div class="audit-summary">${event.task_summary || event.task_id || 'No summary'}</div>
          <div class="audit-meta">
            <span>📊 ${(event.tokens_estimated || 0).toLocaleString()} tokens</span>
            <span>📁 ${event.files_modified?.length || 0} files</span>
            <span>🕐 ${new Date(event.timestamp).toLocaleString()}</span>
          </div>
          ${event.decision_reason ? `<div class="audit-reason">"${event.decision_reason}"</div>` : ''}
        `;
        
        auditLog.appendChild(entry);
      });
    }

    // Render cost chart
    function renderCostChart() {
      const costChart = document.getElementById('cost-chart');
      costChart.innerHTML = '';
      
      // Collect task costs
      const taskCosts = [];
      data.sessions.forEach(session => {
        session.events?.forEach(event => {
          taskCosts.push({
            task: event.task_id || event.task_summary || 'Unknown',
            tokens: event.tokens_estimated || 0
          });
        });
      });
      
      // Sort by tokens (highest first)
      taskCosts.sort((a, b) => b.tokens - a.tokens);
      
      // Take top 10
      const topTasks = taskCosts.slice(0, 10);
      const maxTokens = Math.max(...topTasks.map(t => t.tokens), 1);
      
      // Render bars
      topTasks.forEach(task => {
        const percentage = (task.tokens / maxTokens) * 100;
        const bar = document.createElement('div');
        bar.className = 'cost-bar-container';
        bar.innerHTML = `
          <div class="cost-label" title="${task.task}">${task.task}</div>
          <div class="cost-bar-wrapper">
            <div class="cost-bar" style="width: ${percentage}%">
              ${percentage > 20 ? task.tokens.toLocaleString() : ''}
            </div>
          </div>
          <div class="cost-value">${task.tokens.toLocaleString()}</div>
        `;
        costChart.appendChild(bar);
      });
    }

    // Render prompt diff (latest audit summary)
    function renderPromptDiff() {
      const promptDiff = document.getElementById('prompt-diff-content');
      
      // Find latest event with audit_plain_english
      let latestAudit = null;
      let latestTime = 0;
      
      data.sessions.forEach(session => {
        session.events?.forEach(event => {
          if (event.audit_plain_english) {
            const time = new Date(session.timestamp).getTime();
            if (time > latestTime) {
              latestTime = time;
              latestAudit = event;
            }
          }
        });
      });
      
      if (latestAudit) {
        promptDiff.textContent = latestAudit.audit_plain_english;
      } else {
        promptDiff.textContent = 'No audit summaries available yet.';
      }
    }

    // Update session duration
    function updateSessionDuration() {
      if (data.sessions.length === 0) {
        document.getElementById('session-duration').textContent = 'Session: --';
        return;
      }
      
      const timestamps = data.sessions.map(s => new Date(s.timestamp).getTime());
      const earliest = Math.min(...timestamps);
      const latest = Math.max(...timestamps);
      const duration = latest - earliest;
      
      const hours = Math.floor(duration / (1000 * 60 * 60));
      const minutes = Math.floor((duration % (1000 * 60 * 60)) / (1000 * 60));
      
      document.getElementById('session-duration').textContent = 
        `Session: ${hours}h ${minutes}m`;
    }

    // Listen for data updates from extension
    window.addEventListener('message', event => {
      const message = event.data;
      if (message.type === 'update' && message.data) {
        data = message.data;
        init();
      }
    });

    // Initialize on load
    init();
  </script>
</body>
</html>
