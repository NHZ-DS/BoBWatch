      border-radius: 12px;

      font-size: 14px;
      max-width: 300px;
      animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .info-banner h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .info-banner p {

      font-size: 12px;
      opacity: 0.9;
